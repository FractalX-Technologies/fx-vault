# gitleaks configuration (CI job "gitleaks" in .github/workflows/ci.yml).
# Uses the default rule set and allowlists only the synthetic test vectors below.
# Every allowlisted file holds generated or placeholder values only (the KAT generators live
# next to the vectors); never add a path here for a real credential.
title = "FX Vault gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic cryptographic test vectors and a sample .env with placeholder values"
paths = [
  '''^Packages/FXVaultKit/Tests/VaultCryptoTests/Fixtures/kat/kat_vectors\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/file_v1_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/file_v2_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/EnvToolsTests/Fixtures/sample\.env$''',
  # Removed in 1.0 but still in history, which the CI job scans: dropping them fails every scan.
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/nearby_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/chat_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/team_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/space_kat\.json$''',
  '''^Packages/FXVaultKit/Tests/SharingKitTests/Fixtures/pairing_kat\.json$''',
]
# Migration identifiers (`v18_standalone_key_vaults`) read as a generic API key next to a
# `KeyVaults` case name. Snake case after a version prefix is never a credential.
regexTarget = "secret"
regexes = [
  '''^v[0-9]+_[a-z0-9_]+$''',
]
