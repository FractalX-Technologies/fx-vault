name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: GA toolchain (Xcode 26.x, Swift 6.3). Catches Swift 6.4-only code.
  macos-26:
    name: macos-26
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_26*.app

      - name: XcodeGen drift check
        run: |
          xcodegen generate
          git diff --exit-code -- FXVault.xcodeproj Config/Info.plist
          test -z "$(git status --porcelain -- FXVault.xcodeproj Config/Info.plist)"

      - name: Package tests
        run: swift test --package-path Packages/FXVaultKit

      - name: App build and tests (ad-hoc)
        run: |
          xcodebuild test -project FXVault.xcodeproj -scheme FXVault -destination 'platform=macOS' \
            -disableAutomaticPackageResolution CODE_SIGN_IDENTITY=-

      - name: Lint
        run: scripts/lint.sh

      - name: Secret scan
        run: scripts/check-secrets.sh

  # Non-blocking: the preview Xcode 27 image (matches the dev machine; can queue).
  xcode-27:
    name: xcode-27
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_27*.app

      - name: XcodeGen drift check
        run: |
          xcodegen generate
          git diff --exit-code -- FXVault.xcodeproj Config/Info.plist
          test -z "$(git status --porcelain -- FXVault.xcodeproj Config/Info.plist)"

      - name: Package tests
        run: swift test --package-path Packages/FXVaultKit

      - name: App build and tests (ad-hoc)
        run: |
          xcodebuild test -project FXVault.xcodeproj -scheme FXVault -destination 'platform=macOS' \
            -disableAutomaticPackageResolution CODE_SIGN_IDENTITY=-

      - name: Lint
        run: scripts/lint.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned gitleaks binary (sha256-verified); the gitleaks-action needs a license for org repos.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
