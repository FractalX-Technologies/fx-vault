name: Release

# Releases FX Vault: the official DMG, signed with the organization's Developer ID certificate
# (fastlane match, ios-certificates), notarized with its App Store Connect API key, published
# to GitHub Releases, then the cask in homebrew-tap. Start it from main with Run workflow (or
# `gh workflow run release.yml -f version=1.0.1`): the tag v<version> is created only after
# the signed build passes. A pushed v* tag runs the same jobs. No tests here: ci.yml gates
# main. scripts/release-local.sh --publish on the maintainer's Mac stays the fallback.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, for example 1.0.1 or 1.1.0-beta.1 (tag v<version> must not exist yet)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      create_tag: ${{ steps.version.outputs.create_tag }}
    steps:
      - name: Resolve and validate the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # A release is cut from main only, so it carries what ci.yml checked.
            [[ "$REF" == "refs/heads/main" ]] || { echo "::error::Run this workflow on main, not $REF"; exit 1; }
            version="${INPUT_VERSION#v}"
            create_tag=true
          else
            version="${REF_NAME#v}"
            create_tag=false
            # Anyone who can push may create a tag: only a commit already on main gets signed.
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
            [[ "$status" == "identical" || "$status" == "behind" ]] \
              || { echo "::error::Tag $REF_NAME points at a commit that isn't on main ($status)"; exit 1; }
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: use MAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          if [[ "$create_tag" == true ]] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists: releases are immutable, pick the next version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version (create tag: $create_tag)"

  signed:
    name: Signed and notarized DMG
    needs: meta
    # Forks have neither the organization's signing secrets nor its match repo.
    if: github.repository == 'FractalX-Technologies/fx-vault'
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    # Read-only: fastlane and its gems run here next to the signing keys; the publish job writes.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'QYKC498D5D' }}
      # Repository variables: the organization's are private-only, and this repository is public.
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      CI_APP_CLIENT_ID: ${{ vars.CI_APP_CLIENT_ID }}
      MATCH_REPOSITORY: ios-certificates
      SIGNING_KEYCHAIN_NAME: fxvault-signing.keychain # in ~/Library/Keychains, as create_keychain and match name it
      BUNDLE_FROZEN: "true" # gems come from ci/Gemfile.lock, never resolved in a job that holds signing keys
    steps:
      - name: Check the organization's signing settings
        env:
          HAS_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD != '' }}
          HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT != '' }}
          HAS_CI_APP_KEY: ${{ secrets.CI_APP_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [[ "$HAS_MATCH_PASSWORD" == "true" ]] || missing+=("secret MATCH_PASSWORD")
          [[ "$HAS_ASC_KEY" == "true" ]] || missing+=("secret APP_STORE_CONNECT_API_KEY_CONTENT")
          [[ "$HAS_CI_APP_KEY" == "true" ]] || missing+=("secret CI_APP_PRIVATE_KEY")
          [[ -n "$APP_STORE_CONNECT_API_KEY_ID" ]] || missing+=("variable APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || missing+=("variable APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "$CI_APP_CLIENT_ID" ]] || missing+=("variable CI_APP_CLIENT_ID")
          if (( ${#missing[@]} )); then
            printf '::error::Not available to this repository: %s (docs/RELEASING.md, CI)\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_26*.app

      # No bundler cache: a restored cache skips the CHECKSUMS in ci/Gemfile.lock.
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "4.0"
          bundler-cache: false
          working-directory: ci

      - name: Install the pinned gems
        working-directory: ci
        run: bundle install

      - name: Token for the match repository
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.MATCH_REPOSITORY }}
          permission-contents: read

      # The keychain's password lives only in this step: create_keychain leaves it unlocked for the job.
      - name: Developer ID certificate (match) and profile (App Store Connect API) into a temporary keychain
        working-directory: ci
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          MATCH_GIT_URL: https://github.com/${{ github.repository_owner }}/${{ env.MATCH_REPOSITORY }}.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          export SIGNING_KEYCHAIN_PASSWORD PROFILE_OUTPUT_DIR="$RUNNER_TEMP"
          bundle exec fastlane mac developer_id
          echo "SIGNING_KEYCHAIN=$HOME/Library/Keychains/$SIGNING_KEYCHAIN_NAME-db" >> "$GITHUB_ENV"

      - name: Use the profile in the signed settings
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/fxvault-developer-id.provisionprofile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)"
          printf '#include "Signed.xcconfig"\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$uuid" > Config/Local.xcconfig
          echo "PROFILE_FILE=$profile" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "Profile $uuid"

      - name: Store notarytool credentials in the temporary keychain
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$key"
          xcrun notarytool store-credentials fxvault-notary --key "$key" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --keychain "$SIGNING_KEYCHAIN" > /dev/null
          rm -f "$key"

      - name: Archive, export, gates, notarize, staple, DMG
        run: |
          scripts/release-local.sh --skip-tests --require-clean --team-id "$TEAM_ID" --profile "$PROFILE_FILE" \
            --notary-keychain "$SIGNING_KEYCHAIN" "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: |
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/$SIGNING_KEYCHAIN_NAME-db" 2>/dev/null || true
          rm -f Config/Local.xcconfig "${PROFILE_FILE:-}" "$RUNNER_TEMP/fxvault-developer-id.provisionprofile" "$RUNNER_TEMP/AuthKey.p8"
          # release-local.sh --profile installs a copy for xcodebuild.
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID:-none}.provisionprofile"

  publish:
    name: Attest and publish
    needs: [meta, signed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # gh release create/upload
      id-token: write # actions/attest
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must resolve to HEAD
          persist-credentials: false

      - name: Tag the release
        if: needs.meta.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="FX Vault $VERSION" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" --silent
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          echo "Tagged $GITHUB_SHA as $tag"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/FXVault-${{ needs.meta.outputs.version }}.dmg

      - name: Publish to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-local.sh --publish-only --repo "$GITHUB_REPOSITORY" "$VERSION"

      - name: Next step
        env:
          HAS_TAP_APP: ${{ vars.TAP_APP_CLIENT_ID != '' }}
        run: |
          if [[ "$HAS_TAP_APP" != "true" ]]; then
            echo "::notice::Published. The cask is bumped by hand until the tap App exists (docs/RELEASING.md, Homebrew)."
          fi

  cask:
    name: Bump the Homebrew cask
    needs: [meta, publish]
    # Needs the tap App (docs/RELEASING.md, Homebrew): without it the cask is bumped by hand.
    if: vars.TAP_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAP_REPOSITORY: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Token for the tap
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.TAP_REPOSITORY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.TAP_REPOSITORY }}
          token: ${{ steps.token.outputs.token }}
          path: tap
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: dist

      # --check-release requires the published DMG to have the artifact's sha256.
      - name: Render, commit and push the cask
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          scripts/bump-cask.sh --check-release --tap "$PWD/tap" "$VERSION" "dist/FXVault-$VERSION.dmg"
          if git -C tap diff --quiet -- Casks/fx-vault.rb; then
            echo "The cask already names $VERSION"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -C tap -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "fx-vault $VERSION" -- Casks/fx-vault.rb
          # The header goes through the environment, never on the command line.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git -C tap push -q origin HEAD
          echo "Pushed fx-vault $VERSION to $GITHUB_REPOSITORY_OWNER/$TAP_REPOSITORY"
