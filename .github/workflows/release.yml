name: Release

# Official releases are signed and notarized on the maintainer's Mac with
# scripts/release-local.sh --publish (docs/RELEASING.md); no Apple certificate or key
# is stored on GitHub. This workflow always builds an ad-hoc universal DMG from the
# tag as a verification artifact. The signed job only does real work when the
# `release` environment holds all six signing and notarization secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.0 or 0.1.0-beta.1 (default - the tag name)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "::error::Run this workflow on a v* tag, or pass the version input"
              exit 1
            fi
            version="$REF_NAME"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: use MAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  adhoc:
    name: Ad-hoc DMG (verification artifact)
    needs: meta
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion is the commit count
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_26*.app

      - name: Tests, universal ad-hoc build, gates and DMG
        run: scripts/release-local.sh --adhoc "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}-adhoc
          path: |
            dist/FXVault-${{ needs.meta.outputs.version }}-adhoc.dmg
            dist/FXVault-${{ needs.meta.outputs.version }}-adhoc.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  signed:
    name: Signed and notarized DMG (optional)
    needs: [meta, adhoc]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # gh release create/upload
      id-token: write # actions/attest
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'QYKC498D5D' }}
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_PROFILE_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
    steps:
      - name: Check signing credentials
        run: |
          if [[ "$HAS_SIGNING" == "true" && "$HAS_NOTARY" == "true" ]]; then
            echo "Signing and notarization secrets found: building the official DMG in CI."
          elif [[ "$HAS_SIGNING" == "true" || "$HAS_NOTARY" == "true" ]]; then
            echo "::warning::Only some signing/notarization secrets are set; the signed CI build is skipped."
          else
            echo "::notice::No signing secrets: official releases are signed on the maintainer's Mac (scripts/release-local.sh)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        with:
          xcode-glob: Xcode_26*.app

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/fxvault-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            existing+=("${line#\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | tail -n 1

      - name: Install the provisioning profile and enable signed settings
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/fxvault.provisionprofile"
          printf '%s' "$MACOS_PROFILE_BASE64" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)"
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile" "$profiles_dir/$uuid.provisionprofile"
          rm -f "$profile"
          echo "INSTALLED_PROFILE=$profiles_dir/$uuid.provisionprofile" >> "$GITHUB_ENV"
          printf '%s\n' '#include "Signed.xcconfig"' > Config/Local.xcconfig

      - name: Store notarytool credentials in the temporary keychain
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials fxvault-notary --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --keychain "$SIGNING_KEYCHAIN" > /dev/null
          rm -f "$key"

      - name: Archive, export, gates, notarize, staple, DMG (and publish on tags)
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--skip-tests --team-id "$TEAM_ID" --notary-keychain "$SIGNING_KEYCHAIN")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v$VERSION" ]]; then
            args+=(--publish --repo "$GITHUB_REPOSITORY")
          fi
          scripts/release-local.sh "${args[@]}" "$VERSION"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        with:
          subject-path: dist/FXVault-${{ needs.meta.outputs.version }}.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: |
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          if [[ -n "${INSTALLED_PROFILE:-}" ]]; then rm -f "$INSTALLED_PROFILE"; fi
          rm -f Config/Local.xcconfig "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
