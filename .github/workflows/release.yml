name: Release

# On a v* tag: an ad-hoc universal DMG (the tests and a verification artifact), then the
# official DMG, signed with the organization's Developer ID certificate (fastlane match,
# ios-certificates), notarized with its App Store Connect API key, and published to the
# tag's release. scripts/release-local.sh --publish on the maintainer's Mac stays the
# fallback (docs/RELEASING.md). The cask bump stays manual: nothing here writes to the tap.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.0 or 0.1.0-beta.1 (default - the tag name)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "::error::Run this workflow on a v* tag, or pass the version input"
              exit 1
            fi
            version="$REF_NAME"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: use MAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  adhoc:
    name: Ad-hoc DMG (verification artifact)
    needs: meta
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion is the commit count
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_26*.app

      - name: Tests, universal ad-hoc build, gates and DMG
        run: scripts/release-local.sh --adhoc "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}-adhoc
          path: |
            dist/FXVault-${{ needs.meta.outputs.version }}-adhoc.dmg
            dist/FXVault-${{ needs.meta.outputs.version }}-adhoc.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  signed:
    name: Signed and notarized DMG
    needs: [meta, adhoc]
    # Tags only (the release environment refuses other refs); forks have neither the
    # organization's signing secrets nor its match repo.
    if: github.repository == 'FractalX-Technologies/fx-vault' && github.ref_type == 'tag'
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    # Read-only: fastlane and its gems run here next to the signing keys; the publish job writes.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'QYKC498D5D' }}
      # Repository variables: the organization's are private-only, and this repository is public.
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      CI_APP_CLIENT_ID: ${{ vars.CI_APP_CLIENT_ID }}
      MATCH_REPOSITORY: ios-certificates
      SIGNING_KEYCHAIN_NAME: fxvault-signing.keychain # in ~/Library/Keychains, as create_keychain and match name it
      BUNDLE_FROZEN: "true" # gems come from ci/Gemfile.lock, never resolved in a job that holds signing keys
    steps:
      - name: Check the organization's signing settings
        env:
          HAS_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD != '' }}
          HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT != '' }}
          HAS_CI_APP_KEY: ${{ secrets.CI_APP_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [[ "$HAS_MATCH_PASSWORD" == "true" ]] || missing+=("secret MATCH_PASSWORD")
          [[ "$HAS_ASC_KEY" == "true" ]] || missing+=("secret APP_STORE_CONNECT_API_KEY_CONTENT")
          [[ "$HAS_CI_APP_KEY" == "true" ]] || missing+=("secret CI_APP_PRIVATE_KEY")
          [[ -n "$APP_STORE_CONNECT_API_KEY_ID" ]] || missing+=("variable APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || missing+=("variable APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "$CI_APP_CLIENT_ID" ]] || missing+=("variable CI_APP_CLIENT_ID")
          if (( ${#missing[@]} )); then
            printf '::error::Not available to this repository: %s (docs/RELEASING.md, CI)\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          xcode-glob: Xcode_26*.app

      # No bundler cache: a restored cache skips the CHECKSUMS in ci/Gemfile.lock.
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "4.0"
          bundler-cache: false
          working-directory: ci

      - name: Install the pinned gems
        working-directory: ci
        run: bundle install

      - name: Token for the match repository
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.MATCH_REPOSITORY }}
          permission-contents: read

      # The keychain's password lives only in this step: create_keychain leaves it unlocked for the job.
      - name: Developer ID certificate (match) and profile (App Store Connect API) into a temporary keychain
        working-directory: ci
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          MATCH_GIT_URL: https://github.com/${{ github.repository_owner }}/${{ env.MATCH_REPOSITORY }}.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          export SIGNING_KEYCHAIN_PASSWORD PROFILE_OUTPUT_DIR="$RUNNER_TEMP"
          bundle exec fastlane mac developer_id
          echo "SIGNING_KEYCHAIN=$HOME/Library/Keychains/$SIGNING_KEYCHAIN_NAME-db" >> "$GITHUB_ENV"

      - name: Use the profile in the signed settings
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/fxvault-developer-id.provisionprofile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)"
          printf '#include "Signed.xcconfig"\nPROVISIONING_PROFILE_SPECIFIER = %s\n' "$uuid" > Config/Local.xcconfig
          echo "PROFILE_FILE=$profile" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "Profile $uuid"

      - name: Store notarytool credentials in the temporary keychain
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$key"
          xcrun notarytool store-credentials fxvault-notary --key "$key" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --keychain "$SIGNING_KEYCHAIN" > /dev/null
          rm -f "$key"

      - name: Archive, export, gates, notarize, staple, DMG
        run: |
          # The ad-hoc job already ran the tests on this commit.
          scripts/release-local.sh --skip-tests --require-clean --team-id "$TEAM_ID" --profile "$PROFILE_FILE" \
            --notary-keychain "$SIGNING_KEYCHAIN" "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: |
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg
            dist/FXVault-${{ needs.meta.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/$SIGNING_KEYCHAIN_NAME-db" 2>/dev/null || true
          rm -f Config/Local.xcconfig "${PROFILE_FILE:-}" "$RUNNER_TEMP/fxvault-developer-id.provisionprofile" "$RUNNER_TEMP/AuthKey.p8"
          # release-local.sh --profile installs a copy for xcodebuild.
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID:-none}.provisionprofile"

  publish:
    name: Attest and publish
    needs: [meta, signed]
    if: github.ref_type == 'tag' && github.ref_name == format('v{0}', needs.meta.outputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # gh release create/upload
      id-token: write # actions/attest
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must resolve to HEAD
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FXVault-${{ needs.meta.outputs.version }}
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/FXVault-${{ needs.meta.outputs.version }}.dmg

      - name: Publish to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-local.sh --publish-only --repo "$GITHUB_REPOSITORY" "$VERSION"
