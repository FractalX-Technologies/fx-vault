# FX Vault - XcodeGen project spec (source of truth; tasks/todo.md D1).
# Regenerate with `xcodegen generate` (version pinned in .xcodegen-version).
# The generated FXVault.xcodeproj is committed; CI fails if it drifts from this file.
# Signing settings live only in Config/*.xcconfig (D15).
name: FXVault
options:
  bundleIdPrefix: io.fractalx
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  projectFormat: xcode16_0                   # objectVersion 77: opens in Xcode 26.6 (blocking CI) and 27
  xcodeVersion: "26.0"                       # pinned so a newer XcodeGen does not change the output
  defaultSourceDirectoryType: syncedFolder   # adding a source file never touches project.pbxproj
  defaultConfig: Debug
  groupSortPosition: top
# UITesting is Debug plus FXVAULT_UI_TESTING: the app XCUITest drives, with its own bundle id so
# a test launch never quits a running FX Vault Dev, and a throwaway vault (App/UITesting).
configs:
  Debug: debug
  Release: release
  UITesting: debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  FXVaultKit:
    path: Packages/FXVaultKit                # GRDB and swift-sodium are declared in its Package.swift
targets:
  FXVault:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      UITesting: Config/Base.xcconfig
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: FXVaultKit
        product: FXVaultKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: $(FXVAULT_APP_NAME)          # "FX Vault", or "FX Vault Dev" in Debug
        CFBundleDisplayName: $(FXVAULT_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright (c) 2026 FractalX. MIT License.
        # Geist Sans and Geist Mono (OFL 1.1, App/Resources/Fonts). The synced App folder copies
        # them flat into Contents/Resources, so the path is "." (relative to Resources).
        ATSApplicationFontsPath: .
        NSLocalNetworkUsageDescription: FX Vault uses the local network to share configuration, chat, see your teammates nearby and keep shared scopes in sync with them.
        NSBonjourServices:
          - _fxvault-share._tcp
          - _fxvault-chat._tcp
          - _fxvault-pair._tcp
          - _fxvault-team._tcp
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.fractalx.fxvault.share
            UTTypeDescription: FX Vault Share
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fxvault
              public.mime-type:
                - application/vnd.fractalx.fxvault
          - UTTypeIdentifier: io.fractalx.fxvault.teammate-card
            UTTypeDescription: FX Vault Teammate Card
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fxvcard
              public.mime-type:
                - application/vnd.fractalx.fxvault-card
        CFBundleDocumentTypes:
          - CFBundleTypeName: FX Vault Share
            CFBundleTypeRole: Viewer
            LSHandlerRank: $(FXVAULT_SHARE_HANDLER_RANK)   # Owner; Alternate in Debug
            LSItemContentTypes:
              - io.fractalx.fxvault.share
          - CFBundleTypeName: FX Vault Teammate Card
            CFBundleTypeRole: Viewer
            LSHandlerRank: $(FXVAULT_SHARE_HANDLER_RANK)   # Owner; Alternate in Debug
            LSItemContentTypes:
              - io.fractalx.fxvault.teammate-card
    settings:
      base:
        PRODUCT_NAME: FXVault
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        COMBINE_HIDPI_IMAGES: YES
      # Debug builds are a separate app, "FX Vault Dev", that uses the separate FX Vault Dev
      # vault folder: they must never register with LaunchServices as the real app.
      # scripts/release-local.sh checks the Release identity.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.fractalx.fxvault.dev
          FXVAULT_APP_NAME: FX Vault Dev
          FXVAULT_SHARE_HANDLER_RANK: Alternate
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.fractalx.fxvault
          FXVAULT_APP_NAME: FX Vault
          FXVAULT_SHARE_HANDLER_RANK: Owner
        UITesting:
          PRODUCT_BUNDLE_IDENTIFIER: io.fractalx.fxvault.uitesthost
          FXVAULT_APP_NAME: FX Vault UI Test
          FXVAULT_SHARE_HANDLER_RANK: None
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG FXVAULT_UI_TESTING
  AppTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
      UITesting: Config/Tests.xcconfig
    sources:
      - path: AppTests
    dependencies:
      - target: FXVault                      # XcodeGen sets TEST_HOST/BUNDLE_LOADER (app-hosted tests)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fractalx.fxvault.apptests
        GENERATE_INFOPLIST_FILE: YES         # required, or codesign fails for the test bundle
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  FXVaultUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
      UITesting: Config/Tests.xcconfig
    sources:
      - path: FXVaultUITests
      - path: Shared
    dependencies:
      - target: FXVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fractalx.fxvault.uitests
        GENERATE_INFOPLIST_FILE: YES
        # The runner loads this bundle; with hardened runtime, library validation rejects an
        # ad-hoc bundle ("different Team IDs"). The app under test keeps its hardened runtime.
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  FXVault:
    build:
      targets:
        FXVault: all
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AppTests
        - package: FXVaultKit/VaultCoreTests
        - package: FXVaultKit/VaultCryptoTests
        - package: FXVaultKit/VaultStoreTests
        - package: FXVaultKit/GitHubKitTests
        - package: FXVaultKit/EnvToolsTests
        - package: FXVaultKit/SharingKitTests
        - package: FXVaultKit/SyncEngineTests
        - package: FXVaultKit/VaultDataTests
        - package: FXVaultKit/DestinationKitTests
    profile:
      config: Debug                          # a Release build opens and migrates the real vault (RELEASING.md)
    analyze:
      config: Debug
    archive:
      config: Release
  # The XCUITest suite (scripts/ci-local.sh runs it twice). Only the UITesting app: it is the
  # one build that runs on a throwaway vault and a scripted gh.
  FXVaultUITests:
    build:
      targets:
        FXVault: all
        FXVaultUITests: [test]
    run:
      config: UITesting
    test:
      config: UITesting
      targets:
        - FXVaultUITests
    profile:
      config: UITesting
    analyze:
      config: UITesting
    archive:
      config: Release
